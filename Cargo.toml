[workspace]
# The root package stays the workspace default-member: existing tooling that
# runs bare `cargo build`/`cargo test` from the repo root keeps building
# exactly what it built before this crate existed. `quire-code-parse` is a
# member so `cargo test --workspace` and CI exercise it too, but it is never
# implicitly selected on its own (PLAT-841: purely additive, no change to this
# package's own pipeline).
members = [".", "crates/quire-code-parse"]
default-members = ["."]
resolver = "2"

# Single-sourced across the workspace (PLAT-841 finding 5): quire-code-parse's
# own crate docs promise one pinned tree-sitter version for every consumer of
# this workspace, so that promise has to hold inside the workspace first.
# crates/quire-code-parse references these via `<crate>.workspace = true`
# rather than repeating the version string. As of PLAT-849 this package no
# longer references them directly at all — it reaches tree-sitter only
# through the `quire-code-parse` dependency below, which is what
# `tests/dependency_boundary.rs` enforces — but the pins stay here so that if
# this package ever needed a workspace-shared crate again, the version would
# still be single-sourced rather than redeclared.
[workspace.dependencies]
tree-sitter = "0.26"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
tree-sitter-python = "0.25.0"

[package]
name = "quire-code-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Deterministic source-code knowledge-graph extraction (tree-sitter) for the Filament/Quire ecosystem."
authors = ["Peter Krenesky <kreneskyp@gmail.com>"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/agent-ix/quire-code-rs"

[lib]
name = "quire_code_rs"
path = "src/lib.rs"
crate-type = ["rlib"]

# The producer `agent-ix/quire-corpus` invokes. Its flags and its stdout are a
# pinned contract (`producer_contract.version: 1`), so it is a bin rather than an
# example: an example cannot be executed by an integration test, and an
# unexecutable contract is an unverified one (FR-010).
[[bin]]
name = "extract_tree"
path = "src/bin/extract_tree.rs"

[[bin]]
name = "measure_graph_quality"
path = "src/bin/measure_graph_quality.rs"
required-features = ["measurement"]

[[test]]
name = "measurement_pipeline"
path = "tests/measurement_pipeline.rs"
required-features = ["measurement"]

[dependencies]
serde = { version = "^1", features = ["derive"] }
serde_json = "^1"
# Only `measure_graph_quality` and its test need this. `dev-dependencies`
# can't gate it instead: `measure_graph_quality` is a real standalone binary
# (built for `target/release/`, run outside `cargo test`), and Cargo never
# links dev-deps into a normal `cargo build` or into a `[[bin]]` target — only
# into `cargo test`/`bench`/`example` targets. A default-off feature is the
# mechanism that keeps this out of every other consumer's build (e.g. a
# filament-ide-rs pin bump), since `pub mod measurement` in lib.rs would
# otherwise pull it in unconditionally.
jsonschema = { version = "0.18.3", optional = true, default-features = false, features = ["draft202012"] }
# Stable SHA-256 record ids, matching quire-rs canonical extraction conventions.
sha2 = "^0.10"
thiserror = "^2"
regex = "^1"
# The shared tree-sitter parse layer (PLAT-841). This package's own
# fact/edge pipeline is routed through it (PLAT-849): `crates/quire-code-parse`
# is the one place in this workspace allowed to name `tree-sitter` directly,
# enforced by `tests/dependency_boundary.rs`. A path dependency, not a git-rev
# pin — `quire-code-parse` lives in this same repo/workspace, so the org
# convention of pinning an unpublished crate by git rev (used by cross-repo
# consumers like quire-rs, PLAT-843) does not apply here.
quire-code-parse = { path = "crates/quire-code-parse" }

[features]
measurement = ["dep:jsonschema"]

[dev-dependencies]
serde_json = "^1"

[profile.release]
lto = "thin"
codegen-units = 1
