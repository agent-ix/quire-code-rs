[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
# Our own crates are AGPL-3.0-or-later (the project license); allow it here
# WITHOUT permitting AGPL in third-party dependencies — the allow-list above
# stays permissive-only. `quire-code-parse` was previously unreachable from
# `quire-code-rs` in this check (PLAT-841: additive, no dependency edge
# between them), so this exception was not yet exercised; PLAT-849 adds the
# edge this check now walks, so it needs its own entry alongside the root
# package's.
exceptions = [
    { allow = ["AGPL-3.0-or-later"], crate = "quire-code-rs" },
    { allow = ["AGPL-3.0-or-later"], crate = "quire-code-parse" },
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "warn"

[advisories]
version = 2

[sources]
unknown-registry = "deny"
unknown-git = "deny"
